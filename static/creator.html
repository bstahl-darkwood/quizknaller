<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SmartQuiz – Quiz erstellen</title>
    <meta name="description" content="Eigenes Quiz für SmartQuiz erstellen.">
    <meta name="theme-color" content="#071a3d">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SmartQuiz">
    <meta property="og:locale" content="de_DE">
    <meta property="og:title" content="SmartQuiz – Quiz erstellen">
    <meta property="og:description" content="Eigenes Quiz für SmartQuiz erstellen.">
    <meta property="og:url" content="https://quiz.benjamin-stahl.de/creator">
    <meta property="og:image" content="https://quiz.benjamin-stahl.de/static/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SmartQuiz – Smart Solutions">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/creator.css">
</head>
<body>
    <div class="night-bg" data-lights="off"></div>
    <div class="creator-container">
        <div class="creator-header">
            <div class="logo-section">
                <div class="brand"><svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><use href="#sq-logo"/></svg><h1 class="wordmark logo">Smart<span>Quiz</span></h1></div>
                <p class="spaced tagline">Quiz-Creator · Eigenes Quiz erstellen</p>
            </div>
            <div class="header-actions">
                <a href="/host" class="btn-back">← Zurück zur Quiz-Auswahl</a>
            </div>
        </div>

        <div class="creator-main">
            <!-- Quiz Info Section -->
            <div class="quiz-info-section card">
                <h2>Quiz-Informationen</h2>
                <div class="form-group">
                    <label for="quiz-title">Quiz-Titel *</label>
                    <input type="text" id="quiz-title" placeholder="z. B. Christmas Basecamp Quiz" required>
                </div>
            </div>

            <!-- Questions Section -->
            <div class="questions-section card">
                <div class="section-header">
                    <h2>Fragen (<span id="question-count">0</span>)</h2>
                    <button id="add-question-btn" class="btn-add">+ Frage hinzufügen</button>
                </div>
                <div id="questions-container" class="questions-container">
                    <!-- Questions will be added here dynamically -->
                </div>
            </div>

            <!-- Actions Section -->
            <div class="actions-section card">
                <h2>Aktionen</h2>
                <div class="action-buttons">
                    <div class="action-group">
                        <h3>💾 Speichern & Laden</h3>
                        <button id="save-local-btn" class="btn-action btn-primary">
                            <span class="btn-icon">💾</span>
                            <span>Im Browser speichern</span>
                        </button>
                        <button id="load-local-btn" class="btn-action btn-secondary">
                            <span class="btn-icon">📂</span>
                            <span>Aus Browser laden</span>
                        </button>
                    </div>
                    <div class="action-group">
                        <h3>📥 Import & Export</h3>
                        <button id="download-btn" class="btn-action btn-primary">
                            <span class="btn-icon">⬇️</span>
                            <span>Als JSON herunterladen</span>
                        </button>
                        <label for="upload-input" class="btn-action btn-secondary">
                            <span class="btn-icon">⬆️</span>
                            <span>JSON hochladen</span>
                        </label>
                        <input type="file" id="upload-input" accept=".json" style="display: none;">
                    </div>
                    <div class="action-group">
                        <h3>🗑️ Zurücksetzen</h3>
                        <button id="clear-btn" class="btn-action btn-danger">
                            <span class="btn-icon">🗑️</span>
                            <span>Alles löschen</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="/static/theme.js"></script>
    <script src="/static/creator.js"></script>
</body>
</html>
